name: Tests


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Build, Test, lint and Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true
          bazelrc: |
            build --color=yes
            build --show_timestamps

      - name: Build & lint
        run: |
          bazel build --config=lint //...
          cd third-party/hidapi-cpp && bazel build --config=lint --output_groups=rules_lint_human //...

      # TODO(34): run integraiton tests only if the physical device is present
      - name: Test & lint
        run: |
          bazel test //...
          cd third-party/hidapi-cpp && bazel test //... -//tests/integration/... 

      - name: Format
        run: |
          bazel run //tools/format:format.check 
