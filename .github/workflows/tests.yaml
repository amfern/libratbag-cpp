name: Tests


on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Cancel previous runs for the same branch or pull request automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build, Test, lint and Format
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Restore cached bazel vendor
        id: bazel-vendor-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/bazel-vendor-cache
          key: bazel-vendor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-vendor-${{ runner.os }}-
            bazel-vendor-

      # TODO(34): run integraiton tests only if the physical device is present
      - name: hidapi-cpp - Test, lint and format
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cd third-party/hidapi-cpp
          bazel vendor --config=ci //...
          bazel test --config=ci -- //... -//tests/integration/...
          bazel run --config=ci //tools/format:format.check

      - name: ratbag-cpp - Test, lint and format
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bazel vendor --config=ci //...
          bazel test --config=ci //...
          bazel run --config=ci //tools/format:format.check

      - name: Save bazel vendor to github cache
        if: github.ref == 'refs/heads/main'
        id: cache-primes-save
        uses: actions/cache/save@v6
        with:
          path: |
            ~/bazel-vendor-cache
          key: bazel-vendor-${{ runner.os }}-${{ github.run_id }}
